name: QA

on:
  push:
    branches: [staging, hotfix-runtime, beta-v0.2, step2-admin-analytics, fix-admin-cohort, product-finance-auth, mvp-real-modules]
  pull_request:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      - name: Verify pinned runtime
        run: |
          python - <<'PY'
          from importlib.metadata import version
          expected = {
              'streamlit': '1.62.0',
              'pandas': '3.0.5',
              'plotly': '6.9.0',
              'requests': '2.34.2',
          }
          failed = []
          for package, wanted in expected.items():
              actual = version(package)
              print(f'{package}: {actual}')
              if actual != wanted:
                  failed.append(f'{package} expected {wanted}, got {actual}')
          if failed:
              raise SystemExit('Pinned runtime mismatch: ' + '; '.join(failed))
          print('Pinned runtime verified.')
          PY

      - name: Compile all Python files
        run: |
          python -m compileall -q app.py admin.py admin_v2.py admin_analytics.py legacy_app.py beta_modules.py beta_runtime.py design_system.py finance_workspace.py workspace_modules.py pages

      - name: Validate analytics cohort logic
        run: |
          python - <<'PY'
          import pandas as pd
          from admin_analytics import assert_cohort_consistency, build_module_table, event_sessions, module_explorers, visit_cohort
          rows = [
              {'session_id':'A','evento':'visita','created_at':'2026-08-24T12:00:00Z','utm_source':'direct','utm_campaign':'beta_publica'},
              {'session_id':'A','evento':'pantalla_finanzas','created_at':'2026-08-24T12:01:00Z','utm_source':'direct','utm_campaign':'beta_publica'},
              {'session_id':'B','evento':'pantalla_cobranza','created_at':'2026-08-24T12:02:00Z','utm_source':'direct','utm_campaign':'beta_publica'},
              {'session_id':'C','evento':'visita','created_at':'2026-08-24T12:03:00Z','utm_source':'linkedin','utm_campaign':'beta_agosto_2026'},
              {'session_id':'C','evento':'primera_interaccion','created_at':'2026-08-24T12:04:00Z','utm_source':'linkedin','utm_campaign':'beta_agosto_2026'},
          ]
          events = pd.DataFrame(rows)
          events['created_at'] = pd.to_datetime(events['created_at'], utc=True)
          cohort = visit_cohort(events)
          assert event_sessions(cohort, 'visita') == 2
          assert module_explorers(cohort) == 1
          assert 'B' not in set(cohort['session_id'])
          assert_cohort_consistency(cohort)
          table = build_module_table(cohort, visits=2).set_index('Módulo')
          assert int(table.loc['Finanzas', 'Sesiones que entraron']) == 1
          assert int(table.loc['Cobranza', 'Sesiones que entraron']) == 0
          assert float(table.loc['Finanzas', '% de visitas']) == 50.0
          print('Cohort analytics verified.')
          PY

      - name: Validate finance and module contracts
        run: |
          python - <<'PY'
          import pandas as pd
          import finance_workspace as fw
          import workspace_modules as wm
          sample = pd.DataFrame([
              {'tx_date': pd.Timestamp('2026-08-01'), 'kind':'ingreso', 'status':'pagado', 'category':'Ventas', 'amount':1000000},
              {'tx_date': pd.Timestamp('2026-08-02'), 'kind':'gasto', 'status':'pagado', 'category':'Proveedor', 'amount':300000},
              {'tx_date': pd.Timestamp('2026-08-03'), 'kind':'ingreso', 'status':'pendiente', 'category':'Ventas', 'amount':400000},
          ])
          assert fw._cash({'initial_cash': 200000}, sample) == 900000
          assert len(fw._trend_chart(sample).data) == 3
          assert len(fw._category_chart(sample).data) == 1
          expected = {'cobranza','sii','marketing','inventario','conciliacion','legal','ia'}
          assert set(wm.RENDERERS) == expected
          print('Finance calculations and private module registry verified.')
          PY

      - name: Streamlit runtime smoke test
        run: |
          python - <<'PY'
          from pathlib import Path
          from streamlit.testing.v1 import AppTest

          def assert_clean(at, label):
              if len(at.exception):
                  for exc in at.exception:
                      print(f'ERROR in {label}: {exc.value}')
                  return False
              return True

          failed = []
          at = AppTest.from_file('app.py', default_timeout=20).run()
          if not assert_clean(at, 'app.py'):
              failed.append('app.py')

          for workspace in ['finanzas','cobranza','sii','marketing','inventario','conciliacion','legal','ia']:
              print(f'Running app.py?workspace={workspace}...')
              at = AppTest.from_file('app.py', default_timeout=20)
              at.query_params['workspace'] = workspace
              at.run()
              if not assert_clean(at, f'app.py?workspace={workspace}'):
                  failed.append(f'app.py?workspace={workspace}')

          for module in ['cobranza','sii','marketing','inventario','conciliacion','legal','ia']:
              print(f'Running public app.py?module={module}...')
              at = AppTest.from_file('app.py', default_timeout=20)
              at.query_params['module'] = module
              at.run()
              if not assert_clean(at, f'app.py?module={module}'):
                  failed.append(f'app.py?module={module}')

          for target in sorted(Path('pages').glob('*.py')):
              at = AppTest.from_file(str(target), default_timeout=20).run()
              if not assert_clean(at, str(target)):
                  failed.append(str(target))

          at = AppTest.from_file('admin.py', default_timeout=20).run()
          if not assert_clean(at, 'admin.py'):
              failed.append('admin.py')

          if failed:
              raise SystemExit('Streamlit runtime failures: ' + ', '.join(failed))
          print('All Streamlit runtime smoke tests passed.')
          PY

      - name: Ensure Streamlit secrets are not committed
        run: |
          if [ -f .streamlit/secrets.toml ]; then
            echo 'ERROR: .streamlit/secrets.toml must never be committed.'
            exit 1
          fi

      - name: Check for service-role key references
        run: |
          if grep -R -n 'SUPABASE_SERVICE_ROLE_KEY' . --exclude-dir=.git --exclude='qa.yml'; then
            echo 'ERROR: service-role key reference found in repository source.'
            exit 1
          fi
